<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GiftVault – Digital Gift Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header>
 <button class="hb" onclick="toggleMenu()" aria-label="Menu">☰</button>
 <div class="logo" onclick="nav('home')">🎁 GiftVault</div>
 <span class="sp"></span>
 <div class="srch"><input id="q" placeholder="Search for other gift cards" aria-label="Search gift cards"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></div>
 <span class="bal" id="bal"></span>
 <button class="chip" onclick="openPay()">+ Deposit</button>
 <button class="chip" id="tc" onclick="nav('cart')"></button>
 <button class="chip" id="t2" onclick="nav('codes')"></button>
 <span id="auth"></span>
</header>
<nav class="menu" id="menu" aria-label="Menu"></nav><div class="mscrim" id="ms" onclick="closeMenu()"></div>
<main id="view"></main>
<footer>Demo store. Brand names are shown for illustration only; GiftVault is not affiliated with them. Ratings and reviews are sample data.</footer>
<div class="buybar" id="bb"><span class="num">4</span><div><small>Price</small><div id="pr">₱0</div></div>
 <div class="sec"><svg width="20" height="22" viewBox="0 0 24 24" fill="#22CDB1"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="#1b1c20" stroke-width="2" fill="none"/></svg>Security Assurance</div>
 <button class="out" id="addb" onclick="addCart()">Add to cart</button>
 <button class="buy" id="buyb" onclick="buyNow()">Buy now</button></div>
<div class="mdl" id="gm" role="dialog" aria-modal="true" aria-label="Order" onclick="if(event.target===this)closeGift()"><div class="box" id="gbox"></div></div>
<div class="mdl" id="pay" role="dialog" aria-modal="true" aria-label="Deposit funds" onclick="if(event.target===this)closePay()"><div class="box">
 <div class="mh"><b>Deposit Vault Coins</b><button class="sq" onclick="closePay()" aria-label="Close">✕</button></div>
 <label>Amount (PHP)</label><div class="amts" id="amts"></div>
 <input id="pamt" type="number" min="100" max="50000" placeholder="Custom amount" oninput="setAmt(this.value)">
 <label>Payment method</label><div class="meths" id="meths"></div><div id="pform"></div>
 <button class="b pri" id="payb" style="width:100%;margin-top:16px" onclick="doPay()">Pay</button>
 <p class="note">Demo checkout: no real money moves, and nothing you type here is stored or sent anywhere.</p>
</div></div>
<div class="mdl" id="am" role="dialog" aria-modal="true" aria-label="Account" onclick="if(event.target===this)closeAuth()"><div class="box" id="abox"></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="script.js"></script></body></html>
